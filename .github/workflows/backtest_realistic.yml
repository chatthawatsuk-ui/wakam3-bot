name: Portfolio Backtest (9-Symbol 3Y)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'โหมด: portfolio=9symbols 3Y, btc=BTC เดียว'
        required: false
        default: 'portfolio'
        type: choice
        options:
          - portfolio
          - btc
      days:
        description: 'ย้อนหลังกี่วัน (btc mode เท่านั้น: 365/1095)'
        required: false
        default: '1095'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt matplotlib pyarrow

      - name: Run Backtest
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "portfolio" ]; then
            echo "Portfolio mode — 9 symbols 3Y"
            python backtest_portfolio.py
          else
            DAYS="${{ github.event.inputs.days }}"
            echo "BTC mode — ${DAYS} days"
            python -c "
import backtest_1y_chart as bt
bt.DAYS = int('${DAYS}')
import time as t0
from datetime import datetime, timezone
print(f'Fetching BTC/USDT 30m ({bt.DAYS} days)...')
df = bt.fetch_ohlcv('BTC/USDT', '30m', bt.DAYS)
print(f'  {len(df):,} candles')
trades, eq_ts, eq_val = bt.backtest(df)
bt.plot(df, trades, eq_ts, eq_val)
"
          fi

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f backtest_portfolio.png backtest_1y_chart.png 2>/dev/null || true
          git diff --staged --stat
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "backtest: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X ours --autostash origin main
            git push origin main
          fi
