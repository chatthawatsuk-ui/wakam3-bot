name: Portfolio Backtest (9-Symbol 3Y)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'portfolio = 9 symbols 3Y | btc = BTC only'
        required: false
        default: 'portfolio'
      days:
        description: 'Days (btc mode only: 365 or 1095)'
        required: false
        default: '1095'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt matplotlib pyarrow

      - name: Run Backtest
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "portfolio" ] || [ -z "$MODE" ]; then
            echo "Portfolio mode — 9 symbols 3Y"
            python backtest_portfolio.py
          else
            DAYS="${{ github.event.inputs.days }}"
            echo "BTC mode — ${DAYS} days"
            python backtest_1y_chart.py
          fi

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f backtest_portfolio.png backtest_1y_chart.png 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "backtest: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X ours --autostash origin main
            git push origin main
          fi
