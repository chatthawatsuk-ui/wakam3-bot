name: 3Y Backtest — Run from Local Cache

on:
  workflow_dispatch:
    inputs:
      tf:
        description: 'TF ที่ต้องการ เช่น "1h 4h" (เว้นว่าง = ทุก TF)'
        required: false
        default: ''
      symbols:
        description: 'Symbols เช่น "BTC/USDT ETH/USDT" (เว้นว่าง = 9 ตัวหลัก)'
        required: false
        default: ''
      extended:
        description: 'ใช้ 9 symbols แทน 5 (true/false)'
        required: false
        default: 'true'
  # รันอัตโนมัติทุกวันที่ 1 ของเดือน
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backtest-3y:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo (including historical_data cache)
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          lfs: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check historical_data cache
        run: |
          echo "=== historical_data cache ==="
          ls historical_data/*.parquet 2>/dev/null | wc -l || echo "0"
          echo "files:"
          ls historical_data/*.parquet 2>/dev/null | head -20 || echo "no cache"

      - name: Build backtest command
        id: build_cmd
        run: |
          CMD="python backtest_3y.py"

          # extended (9 symbols) by default
          if [ "${{ github.event.inputs.extended }}" != "false" ]; then
            CMD="$CMD --extended"
          fi

          # TF filter
          if [ -n "${{ github.event.inputs.tf }}" ]; then
            CMD="$CMD --tf ${{ github.event.inputs.tf }}"
          fi

          # Symbol override
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            CMD="$CMD --symbols ${{ github.event.inputs.symbols }}"
          fi

          echo "cmd=$CMD" >> $GITHUB_OUTPUT
          echo "Running: $CMD"

      - name: Run 3Y Backtest (from local cache)
        run: ${{ steps.build_cmd.outputs.cmd }}

      - name: Generate Dashboard Data
        run: python generate_dashboard.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f backtest_3y.csv         2>/dev/null && echo "backtest_3y.csv OK"    || echo "SKIP"
          git add -f backtest_3y_tf.csv      2>/dev/null && echo "backtest_3y_tf.csv OK" || echo "SKIP"
          git add -f dashboard_data.json     2>/dev/null && echo "dashboard_data.json OK" || echo "SKIP"
          git diff --staged --stat
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "backtest_3y: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X ours --autostash origin main
            git push origin main
          fi
