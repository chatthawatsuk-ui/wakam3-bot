name: 3Y Backtest — Monthly

on:
  workflow_dispatch:
    inputs:
      tf:
        description: 'TF ที่ต้องการ (เว้นว่าง = ทุก TF)'
        required: false
        default: ''
      symbols:
        description: 'Symbols (เว้นว่าง = 5 ตัวหลัก)'
        required: false
        default: ''
      years:
        description: 'ย้อนหลังกี่ปี (default ตาม TF: 15m=1yr, 30m=2yr, 1H+=3yr)'
        required: false
        default: ''
      fast:
        description: 'Fast mode: 1H/4H/1D เท่านั้น, 3 symbols (เร็วกว่า)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

  # รันอัตโนมัติทุกวันที่ 1 ของเดือน
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backtest-mtf:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build backtest command
        id: build_cmd
        run: |
          CMD="python backtest_mtf.py"

          # fast mode (schedule หรือ fast=true)
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.fast }}" = "true" ]; then
            CMD="$CMD --fast"
          fi

          # --tf
          if [ -n "${{ github.event.inputs.tf }}" ]; then
            CMD="$CMD --tf ${{ github.event.inputs.tf }}"
          fi

          # --symbols
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            CMD="$CMD --symbols ${{ github.event.inputs.symbols }}"
          fi

          # --years
          if [ -n "${{ github.event.inputs.years }}" ]; then
            CMD="$CMD --years ${{ github.event.inputs.years }}"
          fi

          echo "cmd=$CMD" >> $GITHUB_OUTPUT
          echo "Running: $CMD"

      - name: Run Multi-TF Backtest
        run: ${{ steps.build_cmd.outputs.cmd }}

      - name: Generate Dashboard Data
        run: python generate_dashboard.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f backtest_mtf.csv         2>/dev/null && echo "backtest_mtf.csv OK"         || echo "SKIP"
          git add -f backtest_mtf_summary.csv 2>/dev/null && echo "backtest_mtf_summary.csv OK" || echo "SKIP"
          git add -f dashboard_data.json      2>/dev/null && echo "dashboard_data.json OK"      || echo "SKIP"
          git diff --staged --stat
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "backtest_mtf: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X ours --autostash origin main
            git push origin main
          fi
