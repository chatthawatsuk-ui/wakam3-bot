name: Weekly Backtest — Sun 23:00 TH

on:
  schedule:
    - cron: '0 16 * * 0'    # อาทิตย์ 16:00 UTC = 23:00 Thai time
  workflow_dispatch:
    inputs:
      days:
        description: 'ย้อนหลังกี่วัน (default: 90)'
        required: false
        default: '90'
      tf:
        description: 'TF ที่ต้องการ เช่น "1H 4H" (เว้นว่าง = 30m/1H/2H/4H/1D)'
        required: false
        default: ''
      symbols:
        description: 'Symbols (เว้นว่าง = 10 ตัวหลัก)'
        required: false
        default: ''
      fast:
        description: 'Fast mode: 3 symbols, 60 days, 1H/4H เท่านั้น'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Backtest
        run: |
          CMD="python backtest_live.py"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Scheduled weekly run — 10 symbols, 7 days, 15m/30m/1H/4H/1D"
            CMD="$CMD --days 7"
          else
            # fast mode
            if [ "${{ github.event.inputs.fast }}" = "true" ]; then
              CMD="$CMD --fast"
            fi
            # days
            if [ -n "${{ github.event.inputs.days }}" ]; then
              CMD="$CMD --days ${{ github.event.inputs.days }}"
            fi
            # tf
            if [ -n "${{ github.event.inputs.tf }}" ]; then
              CMD="$CMD --tf ${{ github.event.inputs.tf }}"
            fi
            # symbols
            if [ -n "${{ github.event.inputs.symbols }}" ]; then
              CMD="$CMD --symbols ${{ github.event.inputs.symbols }}"
            fi
          fi

          echo "Running: $CMD"
          $CMD

      - name: Update Dashboard Data
        run: python generate_dashboard.py

      - name: Weekly Report + Telegram Notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python weekly_report.py

      - name: Commit backtest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f backtest_live.csv dashboard_data.json proposals/ 2>/dev/null || true
          git diff --staged --stat
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "backtest: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push origin main
          fi
