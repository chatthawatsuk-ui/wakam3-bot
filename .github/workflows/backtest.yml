name: Weekly Report — Performance + Weight Proposal

on:
  schedule:
    - cron: '0 16 * * 0'    # อาทิตย์ 16:00 UTC = 23:00 Thai time
  workflow_dispatch:
    inputs:
      days:
        description: 'ย้อนหลังกี่วัน (default: 7)'
        required: false
        default: '7'
      force_report:
        description: 'บังคับส่ง Telegram แม้ส่งไปแล้วใน 6 วัน (manual default: true)'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: wakam3-main-state
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare Weekly Report Window
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Scheduled weekly report — live signal/trade log, 7 days max"
          else
            echo "Manual weekly report — live signal/trade log, days=${{ github.event.inputs.days }}"
          fi

      - name: Update Dashboard Data
        run: python generate_dashboard.py

      - name: Weekly Report + Telegram Notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Scheduled runs always force-send; manual dispatch uses the force_report input
          FORCE_REPORT: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.force_report }}
          REPORT_DAYS: ${{ github.event_name == 'schedule' && '7' || github.event.inputs.days }}
        run: python weekly_report.py

      - name: Commit weekly report results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dashboard_data.json proposals/ 2>/dev/null || true
          git add -A -- pending_weights.json pending_condition_points.json pending_regime_weights.json 2>/dev/null || true
          git diff --staged --stat
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "backtest: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X ours --autostash origin main
            git push origin main
          fi
