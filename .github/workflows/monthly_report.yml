name: Monthly Report — Previous Calendar Month

on:
  schedule:
    - cron: '10 0 1 * *'   # วันที่ 1 ของทุกเดือน 00:10 UTC = 07:10 Thai time
  workflow_dispatch:
    inputs:
      month:
        description: 'เดือนที่ต้องการ (YYYY-MM) — ว่างไว้ = previous month'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: wakam3-main-state
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monthly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Monthly Report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MONTH_INPUT="${{ github.event.inputs.month }}"
          if [ -n "$MONTH_INPUT" ]; then
            python monthly_report.py --month "$MONTH_INPUT" --telegram
          else
            python monthly_report.py --previous-month --telegram
          fi

      - name: Commit monthly report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/monthly/ 2>/dev/null || true
          git diff --staged --stat
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "monthly-report: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X ours --autostash origin main
            git push origin main
          fi
