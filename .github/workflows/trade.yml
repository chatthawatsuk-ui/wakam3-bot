name: AI Trade — Scan Every Hour

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan Signals (live_trader.py)
        run: python live_trader.py

      - name: Update Paper Trades (paper_trade.py)
        run: python paper_trade.py

      - name: Generate Dashboard Data (generate_dashboard.py)
        run: python generate_dashboard.py

      - name: Send Telegram Notification (notify.py)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py

      - name: Commit updated data back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          [ -f scan_results.json ]    && git add scan_results.json
          [ -f latest_signals.json ]  && git add latest_signals.json
          [ -f paper_trades.db ]      && git add paper_trades.db
          echo "=== git status ==="
          git status
          echo "=== staged diff ==="
          git diff --staged --stat
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          fi
