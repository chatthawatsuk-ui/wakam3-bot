name: AI Trade — Scan Every Hour

on:
  schedule:
    - cron: '*/15 * * * *'        # ทุก 15 นาที — scan signals
    - cron: '0 23 * * 0'          # อาทิตย์ 23:00 UTC = จันทร์ 06:00 Thai — weekly report
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan Signals (live_trader.py)
        run: python live_trader.py

      - name: Update Paper Trades (paper_trade.py)
        run: python paper_trade.py

      - name: Generate Dashboard Data (generate_dashboard.py)
        run: python generate_dashboard.py

      - name: Send Telegram Notification (notify.py)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py

      - name: Weekly Report — อาทิตย์ 23:00 UTC (= จันทร์ 06:00 Thai) เท่านั้น
        if: github.event.schedule == '0 23 * * 0'
        run: python weekly_report.py

      - name: Commit updated data back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "=== adding files ==="
          git add -f --verbose dashboard_data.json        && echo "dashboard_data.json OK"  || echo "dashboard_data.json FAIL"
          git add -f --verbose scan_results.json          && echo "scan_results.json OK"    || echo "scan_results.json FAIL (not found?)"
          git add -f --verbose latest_signals.json 2>/dev/null && echo "latest_signals.json OK" || echo "latest_signals.json SKIP"
          git add -f --verbose paper_trades.db     2>/dev/null && echo "paper_trades.db OK"     || echo "paper_trades.db SKIP"
          git add -f --verbose proposals/          2>/dev/null && echo "proposals/ OK"           || echo "proposals/ SKIP"
          git add -f --verbose proposals/last_telegram_sent.json 2>/dev/null && echo "last_telegram_sent.json OK" || echo "last_telegram_sent.json SKIP"
          git add -f --verbose notified_signals.json 2>/dev/null && echo "notified_signals.json OK" || echo "notified_signals.json SKIP"
          echo "=== git status ==="
          git status
          echo "=== staged diff ==="
          git diff --staged --stat
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X ours --autostash origin main
            git push origin main
          fi
